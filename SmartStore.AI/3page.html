<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore.ai - Business Profile Setup</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1a73e8;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.8em;
            font-weight: 700;
        }
        header p {
            margin-top: 8px;
            font-size: 1.2em;
            font-weight: 500;
        }
        .container {
            margin: 40px auto;
            width: 50%;
            background-color: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #155db2;
        }
        .success-message {
            display: none;
            color: green;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
    <script>
        function completeBusinessSetup(event) {
            event.preventDefault();
            document.querySelector('.success-message').style.display = 'block';
        }
    </script>
</head>
<body>
    <header>
        <h1>SmartStore.ai</h1>
        <p>Business Profile Setup</p>
    </header>
    <div class="container">
        <h2>Complete Your Business Profile</h2>
        <form onsubmit="completeBusinessSetup(event)">
            <input type="text" placeholder="Shop Space (sq. ft)" required>
            <input type="text" placeholder="Working Hours" required>
            <input type="text" placeholder="Contact Details" required>
            <textarea placeholder="Editable Inventory Types" required></textarea>
            <input type="text" placeholder="Additional Inventory Types (if any)">
            <input type="text" placeholder="Link Payment Details (UPI/Bank)" required>
            <button type="submit">Complete Setup</button>
            <p class="success-message">Welcome to our community! Congratulations! Now, your business management is our responsibility.</p>
        </form>
    </div>
</body>
</html>
