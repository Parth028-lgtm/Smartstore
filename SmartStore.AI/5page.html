<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore.ai - Transactions & Sales History</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1a73e8;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.8em;
            font-weight: 700;
        }
        .container {
            margin: 40px auto;
            width: 70%;
            background-color: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #1a73e8;
            color: white;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        button, select, input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>SmartStore.ai</h1>
        <p>Transactions & Sales History</p>
    </header>
    <div class="container">
        <div class="controls">
            <div>
                <label>Filter by:</label>
                <input type="text" placeholder="Product Name">
                <select>
                    <option>All Payment Types</option>
                    <option>QR Code</option>
                    <option>Cash</option>
                    <option>Card</option>
                </select>
                <input type="date">
                <button onclick="filterData()">Apply Filter</button>
            </div>
            <button onclick="downloadReport()">Download Report (PDF/Excel)</button>
        </div>
        <table>
            <tr>
                <th>Transaction ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Payment Type</th>
            </tr>
            <tr>
                <td>001</td>
                <td>Shampoo</td>
                <td>5</td>
                <td>$25</td>
                <td>2025-03-20</td>
                <td>QR Code</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Soap</td>
                <td>10</td>
                <td>$30</td>
                <td>2025-03-21</td>
                <td>Cash</td>
            </tr>
        </table>
    </div>
    <script>
        function filterData() {
            alert('Filtering data... (This feature is under development)');
        }
        function downloadReport() {
            alert('Report downloaded! (Feature under development)');
        }
    </script>
</body>
</html>
