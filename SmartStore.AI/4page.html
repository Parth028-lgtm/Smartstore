<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore.ai - Inventory Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        header { background-color: #1a73e8; color: white; padding: 20px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 2.8em; font-weight: 700; }
        header p { margin-top: 8px; font-size: 1.2em; font-weight: 500; }
        .container { margin: 40px auto; width: 80%; background-color: white; padding: 30px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 10px; }
        input, select { padding: 8px; margin: 8px 0; width: 100%; border: 1px solid #ddd; border-radius: 5px; }
        button { background-color: #1a73e8; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background-color: #155db2; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #1a73e8; color: white; }
        .bulk-upload { margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>SmartStore.ai</h1>
        <p>Inventory Management - Quick and Efficient</p>
    </header>
    <div class="container">
        <h2>Quick Add Product</h2>
        <input type="text" placeholder="Product Name" id="productName">
        <input type="text" placeholder="Category" id="category">
        <input type="number" placeholder="Quantity" id="quantity">
        <input type="text" placeholder="Stock Status" id="stockStatus">
        <input type="text" placeholder="QR/Barcode" id="barcode">
        <button onclick="addProduct()">Add Product</button>

        <h2>Inventory Table</h2>
        <table>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Stock Status</th>
                <th>QR/Barcode</th>
                <th>Actions</th>
            </tr>
            <tbody id="inventoryTable"></tbody>
        </table>

        <h3>Bulk Upload</h3>
        <input type="file" accept=".csv, .xlsx" class="bulk-upload">
        <button>Upload</button>
    </div>

    <script>
        function addProduct() {
            const name = document.getElementById('productName').value;
            const category = document.getElementById('category').value;
            const quantity = document.getElementById('quantity').value;
            const status = document.getElementById('stockStatus').value;
            const barcode = document.getElementById('barcode').value;

            if (name && category && quantity && status && barcode) {
                const table = document.getElementById('inventoryTable');
                const row = table.insertRow();
                row.innerHTML = `<td>${name}</td><td>${category}</td><td>${quantity}</td><td>${status}</td><td>${barcode}</td>
                <td><button onclick="editProduct(this)">Edit</button> <button onclick="deleteProduct(this)">Delete</button></td>`;
                alert('Product Added Successfully!');
            }
        }

        function editProduct(button) {
            const row = button.parentElement.parentElement;
            for (let i = 0; i < 5; i++) {
                row.cells[i].contentEditable = true;
            }
        }

        function deleteProduct(button) {
            if (confirm('Are you sure you want to delete this product?')) {
                const row = button.parentElement.parentElement;
                row.remove();
            }
        }
    </script>
</body>
</html>
