<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore.ai - Support & Help Center</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1a73e8;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.8em;
            font-weight: 700;
        }
        .container {
            margin: 40px auto;
            width: 60%;
            background-color: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        ul {
            margin-top: 20px;
            margin-left: 20px;
        }
        li {
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #155db2;
        }
    </style>
</head>
<body>
    <header>
        <h1>SmartStore.ai</h1>
        <p>Support & Help Center</p>
    </header>
    <div class="container">
        <h2>Need Help? We're Here for You!</h2>
        <ul>
            <li>Contact Support: <a href="mailto:support@smartstore.ai">Email Us</a> or <a href="#">Chat with Us</a></li>
            <li>FAQs and Troubleshooting Guides</li>
            <li>Feedback and Suggestions</li>
        </ul>
        <h3>Submit Your Query</h3>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Describe your issue or suggestion" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
