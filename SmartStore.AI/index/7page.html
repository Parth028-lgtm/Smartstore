<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore.ai - Settings & Profile Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #1a73e8;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }

        .container {
            margin: 40px auto;
            width: 50%;
            background-color: white;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #155db2;
        }
    </style>
</head>

<body>
    <header>
        <h1>SmartStore.ai</h1>
        <p>Settings & Profile Management</p>
    </header>
    <div class="container">
        <h2>Manage Your Account</h2>
        <form>
            <input type="text" placeholder="Edit Business Name" required>
            <input type="text" placeholder="Update Contact Info" required>
            <input type="text" placeholder="Update Inventory Categories" required>
            <input type="password" placeholder="Change Password" required>
            <input type="email" placeholder="Change Email" required>
            <input type="text" placeholder="Update Payment Details" required>
            <select>
                <option value="">Account Options</option>
                <option value="deactivate">Deactivate Account</option>
                <option value="delete">Delete Account</option>
            </select>
            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>

</html>
